<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b0a">
    <title>Nutauro Suplementos</title>
    <link rel="icon" href="/assets/brand/favicon.png" type="image/png">
    <link rel="preload" href="/fonts/montserrat-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/montserrat-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/css/store.css">
  </head>
  <body>
    <a class="skip" href="#main">Pular para o conteúdo</a>
    <div id="demo-ribbon" hidden></div>
    <header class="hdr" id="hdr">
      <div class="hdr__row wrap">
        <a href="/" class="hdr__logo" data-link aria-label="Nutauro Suplementos — página inicial">
          <img src="/assets/brand/logo-fundo-escuro-200.png" alt="Nutauro — Suplementação e nutrição esportiva" width="247" height="200">
        </a>
        <form class="search" id="search-form" role="search" action="/produtos">
          <label class="sr" for="q">Buscar produtos</label>
          <input id="q" name="q" type="search" placeholder="Buscar whey, creatina, marca…" autocomplete="off" enterkeyhint="search">
          <button type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
        </form>
        <nav class="hdr__actions" aria-label="Atalhos">
          <a href="/produtos" data-link class="hdr__btn hide-sm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Produtos</span></a>
          <a href="/carrinho" data-link class="hdr__btn hdr__cart" aria-label="Carrinho">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9.5" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
            <span class="hide-sm">Carrinho</span>
            <b class="badge" id="cart-count" hidden>0</b>
          </a>
        </nav>
      </div>
      <nav class="cats" id="cat-nav" aria-label="Categorias"><div class="wrap cats__in"></div></nav>
    </header>
    <div id="net-status" class="net" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
    <footer class="ftr" id="ftr"></footer>
    <a id="wa-fab" class="wa-fab" hidden target="_blank" rel="noopener" aria-label="Atendimento pelo WhatsApp">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3Zm0 23.6c-2 0-4-.6-5.7-1.6l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2l-1 1.2c-.2.2-.4.2-.7.1a8.7 8.7 0 0 1-4.3-3.8c-.3-.6.3-.5.9-1.7.1-.2 0-.4 0-.6l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.2 1.1-1.2 2.8s1.2 3.2 1.4 3.5c.2.2 2.4 3.6 5.8 5 2.1.9 3 1 4 .8.7-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5l-.4-.3Z"/></svg>
    </a>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/js/store/main.js"></script>
  </body>
</html>
